name: CI 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Go 测试
    runs-on: ubuntu-latest
    services:
      test-mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: sakura_go_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MYSQL_TEST_DSN: "root@tcp(127.0.0.1:3306)/sakura_go_test"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 检查 Go 格式
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - name: Go 单元与 MySQL 集成测试
        run: go test -count=1 -coverprofile=coverage.go.out ./...
      - name: Go vet
        run: go vet ./...
      - name: 检测并发竞争
        run: go test -race -count=1 ./...
        env:
          # MySQL tests already ran above. Run the non-MySQL suite under the race detector.
          MYSQL_TEST_DSN: ""
      - name: 上传 Go 覆盖率
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.go.out

  security-scan:
    name: Go 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  frontend:
    name: WebUI 验证
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:wiki:browser
      - run: npm run test:assistant:browser

  docker-build-test:
    name: Docker 构建测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 验证 Compose WebUI 端口绑定
        run: go test ./internal/composeconfig -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sakura-bot:test
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 验证 Go 运行时与 WebUI
        run: bash scripts/smoke_image.sh sakura-bot:test "$(tr -d '\r\n' < VERSION)" "$RUNNER_TEMP/smoke-image"
      - name: 验证两个发布附件
        run: |
          go run ./cmd/release-archive build --directory "$RUNNER_TEMP/release-assets" \
            --extract-to "$RUNNER_TEMP/release-smoke"
          bash scripts/smoke_release.sh "$RUNNER_TEMP/release-smoke" sakura-bot:test "$(git rev-parse HEAD)"

  summary:
    name: CI 检查汇总
    runs-on: ubuntu-latest
    needs: [tests, security-scan, frontend, docker-build-test]
    if: always()
    steps:
      - name: 检查所有验证任务
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            test "$result" = success || exit 1
          done
