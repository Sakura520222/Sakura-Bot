name: PR 合并自动发布 Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  analyze-and-update-release:
    name: 分析 PR 并更新 Release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.read_version.outputs.current_version }}
      release_exists: ${{ steps.check_release.outputs.exists }}
      pr_title: ${{ steps.extract_pr_info.outputs.title }}
      pr_number: ${{ steps.extract_pr_info.outputs.pr_number }}
      release_sha: ${{ steps.collect_commits.outputs.release_sha }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main  # 显式指定 main 分支，避免处于 PR ref 导致 push 失败
      
      - name: 提取发布来源信息
        id: extract_pr_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            TITLE="$PR_TITLE"
            LABELS="$PR_LABELS"
          else
            TITLE=$(git log -1 --format=%s)
            PR_NUMBER=""
            LABELS=""
          fi
          # 输出按单行传递，内容只作为数据使用，不插入 shell 脚本源码。
          TITLE=$(printf '%s' "$TITLE" | tr '\r\n' '  ')
          LABELS=$(printf '%s' "$LABELS" | tr '\r\n' '  ')
          printf 'title=%s\npr_number=%s\nlabels=%s\n' "$TITLE" "$PR_NUMBER" "$LABELS" >> "$GITHUB_OUTPUT"
          printf '发布来源: %s\n标题: %s\n' "$EVENT_NAME" "$TITLE"
      
      - name: 分析 PR 类型
        id: analyze_type
        env:
          TITLE: ${{ steps.extract_pr_info.outputs.title }}
          LABELS: ${{ steps.extract_pr_info.outputs.labels }}
        run: |
          # 根据 PR 标签确定类型
          if echo "$LABELS" | grep -q "enhancement"; then
            CHANGE_TYPE="新增"
          elif echo "$LABELS" | grep -q "bug"; then
            CHANGE_TYPE="问题修复"
          elif echo "$LABELS" | grep -q "documentation"; then
            CHANGE_TYPE="文档"
          elif echo "$LABELS" | grep -q "refactor"; then
            CHANGE_TYPE="重构"
          elif echo "$LABELS" | grep -q "performance"; then
            CHANGE_TYPE="优化"
          else
            # 根据标题前缀判断
            if echo "$TITLE" | grep -qiE "^(feat|add|new|新增|添加)"; then
              CHANGE_TYPE="新增"
            elif echo "$TITLE" | grep -qiE "^(fix|bug|修复)"; then
              CHANGE_TYPE="问题修复"
            elif echo "$TITLE" | grep -qiE "^(doc|docs|readme|更新文档)"; then
              CHANGE_TYPE="文档"
            elif echo "$TITLE" | grep -qiE "^(refactor|重构)"; then
              CHANGE_TYPE="重构"
            elif echo "$TITLE" | grep -qiE "^(perf|performance|优化)"; then
              CHANGE_TYPE="优化"
            else
              CHANGE_TYPE="改进"
            fi
          fi
          
          echo "change_type=$CHANGE_TYPE" >> $GITHUB_OUTPUT
          echo "变更类型: $CHANGE_TYPE"
      
      - name: 读取当前版本
        id: read_version
        run: |
          CURRENT_VERSION=$(tr -d '\r\n' < VERSION)
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "VERSION 中的版本号无效。" >&2
            exit 1
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本: $CURRENT_VERSION"

          # 获取今天日期
          TODAY=$(date +'%Y-%m-%d')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "今天日期: $TODAY"

      - name: 提取提交信息到文件
        id: collect_commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ steps.read_version.outputs.current_version }}
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          TAG_NAME="v${VERSION}"
          if TAG_SHA=$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}" 2>/dev/null); then
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::Existing tag ${TAG_NAME} points to ${TAG_SHA}, but release source is ${RELEASE_SHA}. Bump the version instead of overwriting the release."
              exit 1
            fi
          fi
          COMMITS_FILE="${RUNNER_TEMP}/commits_list.txt"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
              echo "PR 提交范围缺失，无法生成发布记录。" >&2
              exit 1
            fi
            git log --format=%s "${BASE_SHA}..${HEAD_SHA}" -- > "$COMMITS_FILE"
          elif PREVIOUS_TAG=$(git describe --tags --abbrev=0 --exclude "v${VERSION}" "$RELEASE_SHA" 2>/dev/null); then
            # 手动发布没有 PR；只收集上一个可达 Tag 之后的提交。
            git log --format=%s "${PREVIOUS_TAG}..${RELEASE_SHA}" -- > "$COMMITS_FILE"
          else
            # 首次发布、没有历史 Tag 时使用当前提交的完整历史。
            git log --format=%s "$RELEASE_SHA" -- > "$COMMITS_FILE"
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "📝 提交信息已写入 $COMMITS_FILE"
      
      - name: 检查 Release 是否存在
        id: check_release
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          TAG_NAME="v${VERSION}"
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Release $TAG_NAME 已存在"
            
            # 获取现有 Release 描述
            gh release view "$TAG_NAME" --json body -q .body > current_body.txt
            echo "现有 Release 描述已读取"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Release $TAG_NAME 不存在，将创建新 Release"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}
      
      - name: 生成 Release 描述
        id: generate_release_notes
        shell: bash
        run: |
          set -e  # 遇到错误立即退出
          
          COMMITS_FILE="${RUNNER_TEMP}/commits_list.txt"
          
          # 定义类型映射表（按优先级排序）
          declare -A TYPE_MAP=(
            ["feat"]="新增功能"
            ["fix"]="问题修复"
            ["docs"]="文档更新"
            ["style"]="代码风格"
            ["refactor"]="重构"
            ["perf"]="性能优化"
            ["test"]="测试相关"
            ["build"]="构建系统"
            ["ci"]="持续集成"
            ["chore"]="其他变更"
            ["i18n"]="国际化"
          )
          
          # 定义输出顺序
          TYPE_ORDER=("feat" "fix" "docs" "style" "refactor" "perf" "test" "build" "ci" "chore" "i18n")
          
          # 解析现有 Release 内容（如果存在）
          declare -A EXISTING_COMMITS
          if [ "$EXISTS" = "true" ] && [ -f "current_body.txt" ]; then
            CURRENT_TYPE=""
            while IFS= read -r line; do
              # 匹配分类标题：### 新增功能
              if [[ "$line" =~ ^###[[:space:]]+(.+)$ ]]; then
                CURRENT_TYPE="${BASH_REMATCH[1]}"
                # 反向查找类型 key
                for key in "${!TYPE_MAP[@]}"; do
                  if [ "${TYPE_MAP[$key]}" = "$CURRENT_TYPE" ]; then
                    CURRENT_TYPE="$key"
                    break
                  fi
                done
              # 匹配条目行：- fix(xxx): message (PR #123)
              elif [[ "$line" =~ ^-[[:space:]] ]]; then
                if [ -n "$CURRENT_TYPE" ]; then
                  EXISTING_COMMITS[$CURRENT_TYPE]="${EXISTING_COMMITS[$CURRENT_TYPE]}$line"$'\n'
                fi
              fi
            done < current_body.txt
            echo "📋 已解析现有 Release 内容"
          fi
          
          # 解析新 PR 的所有提交（包括 PR 标题），按提交类型分类
          declare -A NEW_COMMITS
          
          # 定义正则表达式模式
          PATTERN_BREAKING='^[a-zA-Z]+\([^)]+\)!:'
          PATTERN_NORMAL='^[a-zA-Z]+\([^)]+\):'
          PATTERN_SIMPLE='^[a-zA-Z]+:'
          
          # 添加 PR 标题作为一个"提交"
          echo "$TITLE" > "${RUNNER_TEMP}/all_commits.txt"
          
          # 追加 PR 内的所有提交
          if [ -s "$COMMITS_FILE" ]; then
            cat "$COMMITS_FILE" >> "${RUNNER_TEMP}/all_commits.txt"
          fi
          
          # 解析所有提交，按类型分组
          while IFS= read -r commit; do
            [ -z "$commit" ] && continue
            
            # 提取提交类型
            commit_type=""
            commit_msg="$commit"
            
            if [[ "$commit" =~ $PATTERN_BREAKING ]]; then
              commit_type=$(echo "$commit" | sed -E 's/^([a-zA-Z]+).*/\1/' | tr '[:upper:]' '[:lower:]')
            elif [[ "$commit" =~ $PATTERN_NORMAL ]]; then
              commit_type=$(echo "$commit" | sed -E 's/^([a-zA-Z]+).*/\1/' | tr '[:upper:]' '[:lower:]')
            elif [[ "$commit" =~ $PATTERN_SIMPLE ]]; then
              commit_type=$(echo "$commit" | sed -E 's/^([a-zA-Z]+):.*/\1/' | tr '[:upper:]' '[:lower:]')
            fi
            
            # 检查是否是已知类型
            if [[ -n "$commit_type" ]] && [[ -n "${TYPE_MAP[$commit_type]}" ]]; then
              # 有效类型
              :
            else
              commit_type="chore"
            fi
            
            # 添加到对应类型（不加粗）
            # 添加 PR 编号（如果还没有）
            if [ -n "$PR_NUM" ] && [[ "$commit_msg" != *"(PR #"* ]]; then
              commit_msg="$commit_msg (PR #${PR_NUM})"
              # 如果有标签，添加标签信息
              if [ -n "$LABELS" ]; then
                commit_msg="$commit_msg [$LABELS]"
              fi
            fi
            
            NEW_COMMITS[$commit_type]="${NEW_COMMITS[$commit_type]}- $commit_msg"$'\n'
          done < "${RUNNER_TEMP}/all_commits.txt"
          
          # 合并新旧条目
          declare -A MERGED_COMMITS
          for type in "${TYPE_ORDER[@]}"; do
            # 先添加旧条目
            if [ -n "${EXISTING_COMMITS[$type]}" ]; then
              MERGED_COMMITS[$type]="${EXISTING_COMMITS[$type]}"
            fi
            # 再添加新条目
            if [ -n "${NEW_COMMITS[$type]}" ]; then
              MERGED_COMMITS[$type]="${MERGED_COMMITS[$type]}${NEW_COMMITS[$type]}"
            fi
          done
          
          # 生成 Release 描述
          echo "## 🎉 Release v${VERSION} - ${TODAY}" > release_notes.txt
          echo "" >> release_notes.txt
          
          # 按分类输出
          for type in "${TYPE_ORDER[@]}"; do
            commits="${MERGED_COMMITS[$type]}"
            if [ -n "$commits" ]; then
              echo "### ${TYPE_MAP[$type]}" >> release_notes.txt
              echo "" >> release_notes.txt
              printf '%s\n' "$commits" | awk '!seen[$0]++' >> release_notes.txt
              echo "" >> release_notes.txt
            fi
          done
          
          # 添加分隔线
          echo "---" >> release_notes.txt
          echo "" >> release_notes.txt
          
          echo "✅ Release 描述已生成（按提交类型分组并合并到现有分类）"
          echo "---"
          cat release_notes.txt
          
          # 输出版本信息
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "exists=${EXISTS}" >> $GITHUB_OUTPUT
        env:
          VERSION: ${{ steps.read_version.outputs.current_version }}
          TODAY: ${{ steps.read_version.outputs.today }}
          CHANGE_TYPE: ${{ steps.analyze_type.outputs.change_type }}
          TITLE: ${{ steps.extract_pr_info.outputs.title }}
          PR_NUM: ${{ steps.extract_pr_info.outputs.pr_number }}
          EXISTS: ${{ steps.check_release.outputs.exists }}
          LABELS: ${{ steps.extract_pr_info.outputs.labels }}
      
      - name: 创建或更新 Release
        id: create_or_update_release
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          TAG_NAME="v${VERSION}"
          EXISTS="${{ steps.check_release.outputs.exists }}"
          
          if [ "$EXISTS" = "false" ]; then
            # 创建新 Release
            echo "📝 正在创建 Release ${TAG_NAME}..."
            gh release create "$TAG_NAME" \
              --title "Release ${TAG_NAME}" \
              --target "${{ steps.collect_commits.outputs.release_sha }}" \
              --notes-file release_notes.txt \
              --latest
            echo "✅ Release ${TAG_NAME} 已创建"
            echo "release_action=created" >> $GITHUB_OUTPUT
          else
            # 更新现有 Release
            echo "📝 正在更新 Release ${TAG_NAME}..."
            gh release edit "$TAG_NAME" \
              --notes-file release_notes.txt
            echo "✅ Release ${TAG_NAME} 已更新"
            echo "release_action=updated" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}
      
      - name: 更新 CHANGELOG.md 为引流页面
        run: |
          # 检查 CHANGELOG.md 是否已包含引流提示
          if ! grep -q "查看最新的变更日志，请访问" CHANGELOG.md; then
            echo "📝 正在更新 CHANGELOG.md 为引流页面..."
            
            # 创建临时文件
            {
              echo "# 📋 变更日志"
              echo ""
              echo "> **查看最新的变更日志，请访问 [GitHub Releases](https://github.com/${{ github.repository }}/releases)**"
              echo ""
              echo "本文件仅保留用于历史记录参考。完整的版本发布说明和功能变更记录请查看 GitHub Releases 页面。"
              echo ""
              echo "---"
              echo ""
              echo "## 历史变更记录"
              echo ""
              # 保留原有内容
              cat CHANGELOG.md
            } > CHANGELOG.md.new
            
            mv CHANGELOG.md.new CHANGELOG.md
            
            # 提交更改
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs: 更新 CHANGELOG.md 为引流页面"
            git push
            
            echo "✅ CHANGELOG.md 已更新为引流页面"
          else
            echo "ℹ️ CHANGELOG.md 已是引流页面，跳过更新"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.MY_RELEASE_PAT || secrets.GITHUB_TOKEN }}
      
      - name: 发送评论到 PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.read_version.outputs.current_version }}';
            const exists = '${{ steps.check_release.outputs.exists }}';
            const action = exists === 'true' ? '更新' : '创建';
            
            // 读取 release_notes.txt 文件内容（按字节数安全截断预览，避免截断多字节字符）
            const fs = require('fs');
            let notesPreview = '';
            try {
              // 检查文件是否存在
              if (!fs.existsSync('release_notes.txt')) {
                throw new Error('release_notes.txt 文件不存在');
              }
              const notes = fs.readFileSync('release_notes.txt', 'utf8');
              // 转义反引号以避免破坏 Markdown 代码块
              notesPreview = notes.replace(/`/g, '\\`');

              // 按 UTF-8 字节长度进行截断，确保不截断多字节字符（如 emoji）
              const MAX_PREVIEW_BYTES = 1000;
              const truncateByBytes = (input, maxBytes) => {
                let bytes = 0;
                let result = '';

                for (const ch of input) {
                  const chBytes = Buffer.byteLength(ch, 'utf8');
                  if (bytes + chBytes > maxBytes) {
                    break;
                  }
                  bytes += chBytes;
                  result += ch;
                }

                return result.length < input.length ? `${result}...` : result;
              };

              notesPreview = truncateByBytes(notesPreview, MAX_PREVIEW_BYTES);
            } catch (e) {
              core.warning(`读取 release_notes.txt 失败: ${e instanceof Error ? e.message : String(e)}`);
              notesPreview = '(无法读取预览)';
            }
            
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📝 **已${action} Release v${version} 描述**\n\n\`\`\`\n${notesPreview}\n\`\`\`\n\n---\n\n✅ 变更已记录到 [GitHub Releases](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version})\n\n📦 附件正在打包中，请稍候...`
            });
      
      - name: 清理临时文件
        if: always()
        run: |
          rm -f release_notes.txt current_body.txt new_entry.txt header.txt new_section.txt 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/commits_list.txt" 2>/dev/null || true
          echo "✅ 临时文件已清理"

  build-and-upload-assets:
    name: 打包并上传附件
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: analyze-and-update-release
    if: always() && needs.analyze-and-update-release.result == 'success'
    permissions:
      contents: write
      packages: read
    
    steps:
      - name: 检出发布对应的提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.analyze-and-update-release.outputs.release_sha }}
      
      - name: 设置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 等待并验证远端标签
        id: verify_tag
        env:
          TAG_NAME: v${{ needs.analyze-and-update-release.outputs.version }}
          RELEASE_SHA: ${{ needs.analyze-and-update-release.outputs.release_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..6}; do
            tag_sha=$(git ls-remote origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled=$1; next } { direct=$1 } END { print peeled ? peeled : direct }')
            if [ -n "$tag_sha" ]; then
              break
            fi
            sleep 5
          done
          if [ "$tag_sha" != "$RELEASE_SHA" ] || [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $TAG_NAME ($tag_sha) and checkout must match $RELEASE_SHA."
            exit 1
          fi
          gh release view "$TAG_NAME" >/dev/null
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 生成并校验源码附件
        run: python scripts/release_archive.py build --directory "$RUNNER_TEMP/release-assets"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取同一提交的官方镜像
        id: image
        timeout-minutes: 25
        env:
          RELEASE_SHA: ${{ needs.analyze-and-update-release.outputs.release_sha }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref="$repo:sha-$RELEASE_SHA"
          until docker pull "$ref"; do
            sleep 20
          done
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$ref")
          test "$revision" = "$RELEASE_SHA"
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" |
            awk -v repo="$repo" 'index($0, repo "@sha256:") == 1 { print; exit }')
          test -n "$digest"
          echo "ref=$digest" >> "$GITHUB_OUTPUT"

      - name: 上传发布附件
        env:
          TAG_NAME: ${{ steps.verify_tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="$RUNNER_TEMP/release-assets/Sakura-Bot-$TAG_NAME"
          gh release upload "$TAG_NAME" "$asset.zip" "$asset.tar.gz" "$RUNNER_TEMP/release-assets/SHA256SUMS" --clobber

      - name: 回下载实际发布附件并验证摘要与清单
        env:
          TAG_NAME: ${{ steps.verify_tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          downloaded="$RUNNER_TEMP/downloaded-assets"
          gh release download "$TAG_NAME" --dir "$downloaded" \
            --pattern "Sakura-Bot-$TAG_NAME.zip" --pattern "Sakura-Bot-$TAG_NAME.tar.gz" --pattern SHA256SUMS
          cmp "$RUNNER_TEMP/release-assets/SHA256SUMS" "$downloaded/SHA256SUMS"
          python scripts/release_archive.py verify --directory "$downloaded" --extract-to "$RUNNER_TEMP/release-smoke"

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 验证最终附件的构建和镜像运行
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          RELEASE_SHA: ${{ needs.analyze-and-update-release.outputs.release_sha }}
        run: bash scripts/smoke_release.sh "$RUNNER_TEMP/release-smoke" "$IMAGE_REF" "$RELEASE_SHA"
      
      - name: 发送 Telegram 通知（附件已上传）
        env:
          VERSION: ${{ needs.analyze-and-update-release.outputs.version }}
          TAG_NAME: ${{ steps.verify_tag.outputs.tag }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHANNEL_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            PR_NUMBER="${{ needs.analyze-and-update-release.outputs.pr_number }}"
            if [ -n "$PR_NUMBER" ]; then
              SOURCE_INFO="🔖 PR: #${PR_NUMBER}"
            else
              SOURCE_INFO="🖐 发布方式: 手动运行"
            fi
            
            MESSAGE="🚀 **新版本发布通知**
            
            Sakura-Bot v${VERSION} 已发布！
            
            📦 版本: v${VERSION}
            ${SOURCE_INFO}
            
            📦 **下载附件**:
            ${RELEASE_URL}
            
            ---
            由 GitHub Actions 自动发布"
            
            # 发送消息到 Telegram，附带按钮
            curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=Markdown" \
              -d "disable_web_page_preview=true" \
              -d 'reply_markup={"inline_keyboard":[[{"text":"📄 View Release","url":"'"${RELEASE_URL}"'"}]]}'
            
            echo "✅ Telegram 通知已发送"
          else
            echo "⚠️ 未配置 Telegram 通知"
          fi
      
      - name: 生成发布摘要
        env:
          TAG_NAME: ${{ steps.verify_tag.outputs.tag }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
          
          echo "# 🚀 Release ${TAG_NAME} 创建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 附件已回下载并通过 SHA-256、Docker 构建和挂载冒烟测试" >> $GITHUB_STEP_SUMMARY
          echo "🐳 已验证镜像：${IMAGE_REF}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 发布页面: [${RELEASE_URL}](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
