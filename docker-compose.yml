services:
  sakura-summary-bot:
    # 官方镜像由 GitHub Actions 构建推送（.github/workflows/docker-build.yml）；
    # 保留 build 以便 fork / 本地源码部署：docker compose build && docker compose up -d
    image: ghcr.io/sakura520222/sakura-bot:main
    build: .
    container_name: sakura-bot
    user: "root:root"
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - data/.env
    volumes:
      # 镜像内已含全部代码与依赖；宿主机只持久化数据与日志
      - ./data:/app/data
      - ./logs:/app/logs
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 网络配置
    networks:
      - sakura-network

networks:
  sakura-network:
    driver: bridge
