services:
  sakura-summary-bot:
    image: ${SAKURA_BOT_IMAGE:-ghcr.io/sakura520222/sakura-bot:main}
    build: .
    container_name: sakura-bot
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${WEBUI_PORT:-8080}:${WEBUI_CONTAINER_PORT:-8080}"
    env_file:
      - data/.env
    environment:
      TZ: Asia/Shanghai
      WEBUI_HOST: 0.0.0.0
      WEBUI_PORT: "${WEBUI_CONTAINER_PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - 'case "$$(printf %s "$${WEBUI_ENABLED:-false}" | tr "[:upper:]" "[:lower:]")" in true|1|yes|on) curl -fsS "http://127.0.0.1:$${WEBUI_PORT}/api/health" >/dev/null;; *) test -r /proc/1/cmdline;; esac'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - sakura-network

networks:
  sakura-network:
    driver: bridge
