services:
  sakura-summary-bot:
    # 依赖镜像（Python 依赖 + Go 二进制 + 前端产物）由 GitHub Actions 构建推送
    # （.github/workflows/docker-build.yml），服务器免本地构建；
    # 源码仍整体挂载，代码更新走 git pull / /update 命令。
    # fork / 本地源码部署：docker compose build && docker compose up -d
    image: ghcr.io/sakura520222/sakura-bot:main
    build: .
    container_name: sakura-bot
    user: "root:root"
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - data/.env
    volumes:
      # 挂载源码及 .git，支持 /update；依赖与前端产物由镜像提供
      - .:/app
      # 持久化整个 data 目录 - 避免单文件挂载错误
      - ./data:/app/data
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 网络配置
    networks:
      - sakura-network

networks:
  sakura-network:
    driver: bridge
